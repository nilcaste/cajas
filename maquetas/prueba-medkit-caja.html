<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prueba Caja · med kit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400..800&display=swap" rel="stylesheet">
<style>
  :root {
    --fondo:   #FAFAFA;
    --blanco:  #FFFFFF;
    --tinta:   #17181A;
    --carbon:  #232936;
    --gris:    #8E8E93;
    --borde:   #EDEDED;
    --campo:   #F0F0F1;
    --fuente: "Google Sans Flex", system-ui, -apple-system, sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; margin: 0; }

  /* Transición entre pantallas: la CTA nace del + de la Home */
  @view-transition { navigation: auto; }
  ::view-transition-group(boton-anadir) {
    animation-duration: .42s;
    animation-timing-function: cubic-bezier(.32, 1.26, .4, 1);
  }
  /* La forma (fondo carbón + radio) vive en el contenedor: es lo único que se estira */
  ::view-transition-image-pair(boton-anadir) {
    border-radius: 22px;
    overflow: clip;
    background: #232936;
    isolation: auto;
  }
  /* Los contenidos no se deforman: el viejo se va rápido, el nuevo entra al final */
  ::view-transition-old(boton-anadir),
  ::view-transition-new(boton-anadir) {
    height: 100%;
    width: 100%;
    object-fit: cover;
    mix-blend-mode: normal;
  }
  ::view-transition-old(boton-anadir) { animation: vt-fuera .1s ease both; }
  ::view-transition-new(boton-anadir) { animation: vt-dentro .2s ease .15s both; }
  @keyframes vt-fuera { to { opacity: 0; } }
  @keyframes vt-dentro { from { opacity: 0; } to { opacity: 1; } }
  ::view-transition-old(root), ::view-transition-new(root) { animation-duration: .22s; }
  @media (prefers-reduced-motion: reduce) {
    @view-transition { navigation: none; }
  }

  body {
    background: var(--fondo);
    color: var(--tinta);
    font-family: var(--fuente);
    -webkit-font-smoothing: antialiased;
    max-width: 430px;
    margin: 0 auto;
    min-height: 100vh;
    padding: 24px 20px 140px;
  }

  /* ---------- Barra superior: volver + ajustes ---------- */
  .barra {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 2px 0 16px;
  }
  .icono-btn {
    color: var(--tinta);
    display: flex;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: transform .3s cubic-bezier(.22, .9, .28, 1.2), opacity .12s ease;
    text-decoration: none;
  }
  .icono-btn:active { transform: scale(.85); opacity: .6; transition-duration: .08s; }

  /* ---------- Cabecera de la caja ---------- */
  .cabecera {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 2px 2px 18px;
  }
  .cabecera .num-tesela {
    flex: none;
    width: 56px;
    height: 56px;
    border-radius: 16px;
    background: var(--campo);
    border: 1px solid #E6E6E7;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--mono);
    font-size: 18px;
    font-weight: 700;
    user-select: none;
  }
  .cabecera h1 {
    font-size: 25px;
    font-weight: 700;
  }
  .cabecera .sub {
    color: var(--gris);
    font-size: 14.5px;
    font-weight: 500;
    margin-top: 2px;
  }
  .cabecera .sub .num {
    font-family: var(--mono);
    font-size: 13px;
  }

  /* ---------- Ítems ---------- */
  .ítems { display: flex; flex-direction: column; gap: 10px; }
  .obj {
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--blanco);
    border: 1px solid var(--borde);
    border-radius: 20px;
    padding: 12px 12px 12px 14px;
    -webkit-tap-highlight-color: transparent;
  }
  .obj .tesela {
    flex: none;
    width: 48px;
    height: 48px;
    border-radius: 14px;
    background: #FAFAFB;
    border: 1px solid #E6E6E7;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
    user-select: none;
  }
  .obj .texto { flex: 1 1 auto; min-width: 0; }
  .obj .nombre {
    color: #1B1B1D;
    font-size: 16px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .obj .tipo { color: var(--gris); font-size: 13.5px; font-weight: 500; margin-top: 1px; }

  /* Stepper del lenguaje med-kit: teselas grises con iconos del sistema */
  .stepper { flex: none; display: flex; align-items: center; gap: 3px; }
  .stepper button {
    -webkit-appearance: none;
    appearance: none;
    border: 1px solid #E5E5E6;
    background: var(--campo);
    color: var(--tinta);
    width: 38px;
    height: 38px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: transform .3s cubic-bezier(.22, .9, .28, 1.2), background-color .15s ease;
  }
  .stepper button:active {
    transform: scale(.88);
    background: #E8E8E9;
    transition-duration: .08s;
  }
  .stepper .cifra {
    min-width: 24px;
    text-align: center;
    font-size: 16px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .cifra--pop { animation: pop .28s cubic-bezier(.22, .9, .28, 1.4); }
  @keyframes pop {
    0% { transform: scale(1); }
    40% { transform: scale(1.25); }
    100% { transform: scale(1); }
  }

  .quitar {
    -webkit-appearance: none;
    appearance: none;
    border: 1px solid #E5E5E6;
    background: var(--campo);
    color: var(--tinta);
    width: 38px;
    height: 38px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: transform .3s cubic-bezier(.22, .9, .28, 1.2), background-color .15s ease;
  }
  .quitar:active {
    transform: scale(.88);
    background: #E8E8E9;
    transition-duration: .08s;
  }

  /* Fila saliendo: se encoge para que las de abajo no salten */
  .obj {
    transition: transform .3s cubic-bezier(.22, .9, .28, 1.15), opacity .22s ease,
                height .24s ease, margin .24s ease, padding .24s ease;
  }
  .obj:active { transform: scale(.985); transition-duration: .09s; }
  .obj--fuera { opacity: 0; }
  /* Fila entrando (deshacer o recién añadida) */
  .obj--entrando { opacity: 0; transform: translateY(10px); }
  .obj--flash { animation: flash 1.2s ease; }
  @keyframes flash {
    from { background: var(--campo); }
    to   { background: var(--blanco); }
  }

  /* Caja sin nada dentro */
  .vacio { text-align: center; padding: 48px 20px; }
  .vacio__emoji { font-size: 46px; line-height: 1; display: block; opacity: .38; margin-bottom: 12px; }
  .vacio__titulo { font-size: 17px; font-weight: 600; color: var(--tinta); }
  .vacio__sub { color: var(--gris); font-size: 14.5px; font-weight: 500; margin-top: 3px; }
  .oculto { display: none !important; }

  /* Toast del sistema, con deshacer */
  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(96px + env(safe-area-inset-bottom));
    transform: translateX(-50%) translateY(8px);
    z-index: 20;
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--carbon);
    color: #fff;
    border-radius: 999px;
    padding: 12px 18px;
    font-size: 14px;
    font-weight: 600;
    box-shadow: 0 10px 28px rgba(23, 24, 26, .24);
    opacity: 0;
    pointer-events: none;
    transition: opacity .18s ease, transform .22s cubic-bezier(.22, .9, .28, 1.2);
  }
  .toast--visible { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
  .toast .sep { opacity: .45; }
  .toast .deshacer {
    -webkit-appearance: none;
    appearance: none;
    border: 0;
    background: none;
    color: #fff;
    font: inherit;
    text-decoration: underline;
    text-underline-offset: 3px;
    padding: 6px 2px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  /* ---------- Flotante inferior: CTA añadir ---------- */
  .velo-inferior {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    height: 150px;
    background: linear-gradient(to top, #FAFAFA 38%, rgba(250, 250, 250, .85) 62%, rgba(250, 250, 250, 0));
    pointer-events: none;
    z-index: 5;
  }
  .flotante {
    position: fixed;
    left: max(20px, calc(50vw - 195px));
    right: max(20px, calc(50vw - 195px));
    bottom: 24px;
    z-index: 10;
  }
  .cta {
    width: 100%;
    view-transition-name: boton-anadir;
    -webkit-appearance: none;
    appearance: none;
    border: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: var(--carbon);
    color: #fff;
    border-radius: 22px;
    height: 56px;
    font-family: inherit;
    font-size: 16.5px;
    font-weight: 600;
    box-shadow: 0 6px 16px rgba(23, 24, 26, .16);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: transform .34s cubic-bezier(.22, .9, .28, 1.2), box-shadow .2s ease;
  }
  .cta:active {
    transform: scale(.97);
    box-shadow: 0 3px 8px rgba(23, 24, 26, .18);
    transition-duration: .09s;
  }
  .cta span { display: flex; }

  @media (prefers-reduced-motion: reduce) {
    .icono-btn, .obj, .stepper button, .cta, .toast { transition: none; }
    .cifra--pop, .obj--flash { animation: none; }
  }
  @media (min-width: 900px) {
    body { max-width: 640px; padding-top: 44px; }
    .flotante { left: max(20px, calc(50vw - 300px)); right: max(20px, calc(50vw - 300px)); }
  }
</style>
</head>
<body>

<nav class="barra">
  <a class="icono-btn" href="prueba-medkit.html" aria-label="Volver">
    <svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg>

  <article class="obj">

    <div class="texto">

    <div class="stepper">
      <button type="button" aria-label="Quitar uno">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M4.5 12h15"/></svg>
      </button>

      <button type="button" aria-label="Añadir uno">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 4.5v15M4.5 12h15"/></svg>

    <div class="stepper">
      <button type="button" aria-label="Quitar uno">

      </button>
      <span class="cifra">2</span>
      <button type="button" aria-label="Añadir uno">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 4.5v15M4.5 12h15"/></svg>

  <article class="obj">

<div class="vacio oculto" id="caja-vacia">
  <span class="vacio__emoji" aria-hidden="true">🫙</span>

      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 4.5v15M4.5 12h15"/></svg>
    </span>
    Añadir ítem
  </button>
</div>

<script>
(function () {
  const lista = document.getElementById('lista-items');
  const vacia = document.getElementById('caja-vacia');
  const cuenta = document.getElementById('cuenta');
  const toastEl = document.getElementById('toast');
  const toastTexto = document.getElementById('toast-texto');
  const reducida = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const iconoMenos = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M4.5 12h15"/></svg>';
  const iconoMas = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 4.5v15M4.5 12h15"/></svg>';

  function esc(t) {
    return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function actualizarCuenta() {
    const n = lista.querySelectorAll('.obj').length;
    cuenta.textContent = n + (n === 1 ? ' ítem' : ' ítems');
    vacia.classList.toggle('oculto', n > 0);
  }

  function pop(cifra) {
    cifra.classList.remove('cifra--pop');
    void cifra.offsetWidth;
    cifra.classList.add('cifra--pop');
  }

  /* ---------- Toast con deshacer ---------- */
  let tToast = null;
  let accionDeshacer = null;

  function mostrarToast(texto, accion) {
    accionDeshacer = accion;
    toastTexto.textContent = texto;
    toastEl.classList.add('toast--visible');
    clearTimeout(tToast);
    tToast = setTimeout(ocultarToast, 5000);
  }
  function ocultarToast() {
    clearTimeout(tToast);
    toastEl.classList.remove('toast--visible');
    accionDeshacer = null;
  }
  document.getElementById('deshacer').addEventListener('click', () => {
    const accion = accionDeshacer;
    ocultarToast();
    if (accion) accion();
  });

  /* ---------- Salida y entrada de filas ---------- */
  /* Colapsa alto y márgenes antes de quitarla: las de abajo no dan el salto */
  function sacarFila(fila, alTerminar) {
    if (reducida) { alTerminar(); return; }
    const alto = fila.offsetHeight;
    fila.style.height = alto + 'px';
    fila.style.overflow = 'hidden';
    void fila.offsetWidth;
    fila.classList.add('obj--fuera');
    fila.style.height = '0px';
    fila.style.paddingTop = '0px';
    fila.style.paddingBottom = '0px';
    /* el hueco del gap se come con un margen negativo */
    if (fila.previousElementSibling) fila.style.marginTop = '-10px';
    else fila.style.marginBottom = '-10px';
    setTimeout(alTerminar, 240);
  }

  function limpiarEstilos(fila) {
    fila.classList.remove('obj--fuera');
    fila.style.height = '';
    fila.style.overflow = '';
    fila.style.paddingTop = '';
    fila.style.paddingBottom = '';
    fila.style.marginTop = '';
    fila.style.marginBottom = '';
  }

  function meterFila(fila, siguiente, conFlash) {
    limpiarEstilos(fila);
    if (siguiente && siguiente.parentNode === lista) lista.insertBefore(fila, siguiente);
    else lista.appendChild(fila);
    if (reducida) return;
    fila.classList.add('obj--entrando');
    requestAnimationFrame(() => requestAnimationFrame(() => {
      fila.classList.remove('obj--entrando');
      if (conFlash) fila.classList.add('obj--flash');
    }));
  }

  /* ---------- Mantener pulsado repite ---------- */
  function repetible(boton, accion) {
    let espera = null;
    let repite = null;
    function parar() {
      clearTimeout(espera);
      clearInterval(repite);
      espera = repite = null;
    }
    boton.addEventListener('pointerdown', e => {
      if (e.button !== 0 && e.pointerType === 'mouse') return;
      accion();
      espera = setTimeout(() => { repite = setInterval(accion, 140); }, 450);
    });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev =>
      boton.addEventListener(ev, parar));
    /* Teclado: el click sintético (detail 0) no pasa por pointerdown */
    boton.addEventListener('click', e => { if (e.detail === 0) accion(); });
  }

  /* ---------- Quitar con opción de deshacer ---------- */
  function quitarFila(fila, cantidadPrevia) {
    if (fila.dataset.saliendo) return;
    fila.dataset.saliendo = '1';
    const siguiente = fila.nextElementSibling;
    sacarFila(fila, () => {
      fila.remove();
      actualizarCuenta();
      mostrarToast('Quitado', () => {
        delete fila.dataset.saliendo;
        const cifra = fila.querySelector('.cifra');
        if (cifra && cantidadPrevia != null) cifra.textContent = cantidadPrevia;
        meterFila(fila, siguiente, false);
        actualizarCuenta();
      });
    });
  }

  /* ---------- Enganchar una fila (las de serie y las nuevas) ---------- */
  function engancharFila(fila) {
    const stepper = fila.querySelector('.stepper');
    if (!stepper) {
      const quitar = fila.querySelector('.quitar');
      if (quitar) quitar.addEventListener('click', () => quitarFila(fila, null));
      return;
    }
    const botones = stepper.querySelectorAll('button');
    const cifra = stepper.querySelector('.cifra');
    function pon(n) {
      if (fila.dataset.saliendo) return;
      if (n <= 0) { quitarFila(fila, parseInt(cifra.textContent, 10)); return; }
      cifra.textContent = n;
      pop(cifra);
    }
    repetible(botones[0], () => pon(parseInt(cifra.textContent, 10) - 1));
    repetible(botones[1], () => pon(parseInt(cifra.textContent, 10) + 1));
  }

  lista.querySelectorAll('.obj').forEach(engancharFila);

  /* ---------- Lo que acabas de añadir entra arriba, con destello ---------- */
  let recien = null;
  try {
    const guardado = localStorage.getItem('cajas.recien');
    if (guardado) {
      recien = JSON.parse(guardado);
      localStorage.removeItem('cajas.recien');
    }
  } catch (e) { /* sin almacenamiento: simplemente no hay novedad */ }

  if (recien && recien.nombre) {
    const suministro = recien.tipo !== 'Único';
    const fila = document.createElement('article');
    fila.className = 'obj';
    fila.innerHTML = `
      <span class="tesela" aria-hidden="true">${esc(recien.emoji || '🏷️')}</span>
      <div class="texto">
        <div class="nombre">${esc(recien.nombre)}</div>
        <div class="tipo">${suministro ? 'Suministro' : 'Único'}</div>
      </div>
      ${suministro
        ? `<div class="stepper">
             <button type="button" aria-label="Quitar uno">${iconoMenos}</button>
             <span class="cifra">1</span>
             <button type="button" aria-label="Añadir uno">${iconoMas}</button>
           </div>`
        : `<button type="button" class="quitar" aria-label="Quitar de la caja">
             <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 7h15"/><path d="M9.5 7V5.4c0-.8.6-1.4 1.4-1.4h2.2c.8 0 1.4.6 1.4 1.4V7"/><path d="M6.8 7l.7 11.2c.06 1 .9 1.8 1.9 1.8h5.2c1 0 1.84-.8 1.9-1.8L17.2 7"/><path d="M10.2 11v5.4M13.8 11v5.4"/></svg>
           </button>`}`;
    engancharFila(fila);
    meterFila(fila, lista.firstElementChild, true);
  }

  actualizarCuenta();
})();
</script>

</body>
</html>
