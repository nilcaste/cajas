<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prueba Ajustes · med kit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400..800&display=swap" rel="stylesheet">
<style>
  :root {
    --fondo:   #FAFAFA;
    --blanco:  #FFFFFF;
    --tinta:   #17181A;
    --carbon:  #232936;
    --gris:    #8E8E93;
    --borde:   #EDEDED;
    --campo:   #F0F0F1;
    --fuente: "Google Sans Flex", system-ui, -apple-system, sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; margin: 0; }

  @view-transition { navigation: auto; }
  ::view-transition-old(root), ::view-transition-new(root) { animation-duration: .22s; }
  @media (prefers-reduced-motion: reduce) {
    @view-transition { navigation: none; }
  }

  body {
    background: var(--fondo);
    color: var(--tinta);
    font-family: var(--fuente);
    -webkit-font-smoothing: antialiased;
    max-width: 430px;
    margin: 0 auto;
    min-height: 100vh;
    padding: 24px 20px 140px;
  }

  .barra {
    display: flex;
    align-items: center;
    padding: 2px 0 16px;
  }
  .icono-btn {
    color: var(--tinta);
    display: flex;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: transform .3s cubic-bezier(.22, .9, .28, 1.2), opacity .12s ease;
    text-decoration: none;
  }
  .icono-btn:active { transform: scale(.85); opacity: .6; transition-duration: .08s; }

  .cabecera { padding: 2px 2px 16px; }
  .cabecera h1 { font-size: 25px; font-weight: 700; }
  .cabecera .sub {
    color: var(--gris);
    font-size: 14.5px;
    font-weight: 500;
    margin-top: 2px;
  }
  .cabecera .sub .num { font-family: var(--mono); font-size: 13px; }

  .seccion {
    color: #6E6E73;
    font-size: 15px;
    font-weight: 600;
    margin: 20px 2px 10px;
  }

  .campo {
    display: flex;
    align-items: center;
    background: var(--campo);
    border: 1px solid #E5E5E6;
    border-radius: 18px;
    height: 52px;
    padding: 0 16px;
    transition: background-color .16s ease, border-color .16s ease, box-shadow .16s ease;
  }
  .campo input {
    flex: 1 1 auto;
    min-width: 0;
    border: 0;
    background: transparent;
    outline: none;
    font-family: inherit;
    font-size: 16.5px;
    font-weight: 500;
    color: var(--tinta);
    caret-color: var(--carbon);
  }
  .campo input.mono {
    font-family: var(--mono);
    font-size: 16px;
  }
  .campo:focus-within {
    background: var(--blanco);
    border-color: #D2D2D5;
    box-shadow: 0 2px 10px rgba(23, 24, 26, .06);
  }
  .pista {
    color: var(--gris);
    font-size: 13px;
    font-weight: 500;
    margin: 8px 2px 0;
  }

  /* Fila de acción: imprimir QR */
  .accion {
    width: 100%;
    display: flex;
    align-items: center;
    text-align: left;
    gap: 14px;
    background: var(--blanco);
    border: 1px solid var(--borde);
    border-radius: 20px;
    padding: 10px 12px;
    font-family: inherit;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: transform .3s cubic-bezier(.22, .9, .28, 1.15);
  }
  .accion:active { transform: scale(.985); transition-duration: .09s; }
  .accion .tesela {
    flex: none;
    width: 48px;
    height: 48px;
    border-radius: 14px;
    background: var(--campo);
    border: 1px solid #E6E6E7;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--tinta);
  }
  .accion .texto { flex: 1 1 auto; min-width: 0; }
  .accion .nombre { font-size: 16px; font-weight: 600; color: #1B1B1D; }
  .accion .tipo { color: var(--gris); font-size: 13.5px; font-weight: 500; margin-top: 1px; }
  .accion .flecha { flex: none; color: #C9C9CC; display: flex; }

  .velo-inferior {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    height: 150px;
    background: linear-gradient(to top, #FAFAFA 38%, rgba(250, 250, 250, .85) 62%, rgba(250, 250, 250, 0));
    pointer-events: none;
    z-index: 5;
  }
  .flotante {
    position: fixed;
    left: max(20px, calc(50vw - 195px));
    right: max(20px, calc(50vw - 195px));
    bottom: 24px;
    z-index: 10;
  }
  .cta {
    width: 100%;
    -webkit-appearance: none;
    appearance: none;
    border: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--carbon);
    color: #fff;
    border-radius: 22px;
    height: 56px;
    font-family: inherit;
    font-size: 16.5px;
    font-weight: 600;
    box-shadow: 0 6px 16px rgba(23, 24, 26, .16);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: transform .34s cubic-bezier(.22, .9, .28, 1.2), box-shadow .2s ease;
  }
  .cta:active {
    transform: scale(.97);
    box-shadow: 0 3px 8px rgba(23, 24, 26, .18);
    transition-duration: .09s;
  }

  @media (prefers-reduced-motion: reduce) {
    .icono-btn, .campo, .accion, .cta { transition: none; }
  }
  /* ==========================================================
     Escritorio: esto es un paso de proceso, no una pantalla.
     Se presenta como modal sobre la pantalla anterior atenuada.
     ========================================================== */
  @media (min-width: 900px) {
    html { background: var(--fondo); }
    html::before {
      content: "";
      position: fixed;
      inset: 0;
      background: rgba(23, 24, 26, .20);
      z-index: 0;
    }
    body {
      position: relative;
      z-index: 1;
      max-width: 520px;
      min-height: 0;
      margin: 56px auto;
      padding: 24px 26px 26px;
      background: var(--blanco);
      border: 1px solid var(--borde);
      border-radius: 24px;
      box-shadow: 0 24px 60px rgba(23, 24, 26, .18);
    }
    /* La CTA deja de flotar: vive dentro de la tarjeta */
    .velo-inferior { display: none; }
    .flotante {
      position: static;
      left: auto;
      right: auto;
      bottom: auto;
      margin-top: 26px;
    }
    dialog.hoja { margin: auto; }
  }
</style>
</head>
<body>

<nav class="barra">
  <a class="icono-btn" href="prueba-medkit-caja.html" aria-label="Cerrar sin guardar">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
  </a>
</nav>

<header class="cabecera">
  <h1>Ajustes de la caja</h1>
  <div class="sub"><span class="num">CAJA 01</span> · Baño repuestos</div>
</header>

<div class="seccion">Número</div>
<label class="campo">
  <input class="mono" type="text" value="01" aria-label="Número de la caja" autocomplete="off" inputmode="numeric">
</label>
<div class="pista">Es el número de la pegatina. Puede repetirse: tú mandas.</div>

<div class="seccion">Nombre</div>
<label class="campo">
  <input type="text" value="Baño repuestos" aria-label="Nombre de la caja" autocomplete="off">
</label>

<div class="seccion">Ubicación</div>
<label class="campo">
  <input type="text" value="Armario del pasillo" aria-label="Ubicación de la caja" autocomplete="off" placeholder="Opcional">
</label>

<div class="seccion">Etiqueta</div>
<button type="button" class="accion">
  <span class="tesela" aria-hidden="true">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><path d="M13.5 13.5h3v3h-3zM17 17h3v3h-3z" stroke-linecap="round"/></svg>
  </span>
  <span class="texto">
    <span class="nombre" style="display:block;">Imprimir QR</span>
    <span class="tipo" style="display:block;">Para pegar en la caja</span>
  </span>
  <span class="flecha" aria-hidden="true">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9.5 5.5 6.5 6.5-6.5 6.5"/></svg>
  </span>
</button>

<div class="velo-inferior" aria-hidden="true"></div>

<div class="flotante">
  <button type="button" class="cta" onclick="location.href='prueba-medkit-caja.html'">Guardar</button>
</div>

</body>
</html>
